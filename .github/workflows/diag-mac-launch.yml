name: diag mac launch (ticket abdffb55, temporary)
on: push
jobs:
  launch:
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, macos-26]
        where: [downloads, applications]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install, approved as "Open Anyway" leaves it
        run: |
          set -x
          sw_vers; uname -m
          cd "$RUNNER_TEMP"
          curl -sSLo RunHQ.dmg "https://github.com/runhq-io/runhq-desktop-releases/releases/download/v0.2.45/RunHQ-0.2.45-universal.dmg"
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" RunHQ.dmg
          hdiutil attach -nobrowse -mountpoint /Volumes/RunHQ RunHQ.dmg
          if [ "${{ matrix.where }}" = downloads ]; then dest="$HOME/Downloads/RunHQ.app"; mkdir -p ~/Downloads; else dest=/Applications/RunHQ.app; fi
          ditto /Volumes/RunHQ/RunHQ.app "$dest"
          hdiutil detach /Volumes/RunHQ
          # 0x40 = user approved (what Open Anyway records); quarantine stays, so translocation still applies.
          xattr -w com.apple.quarantine "00c3;$(printf %x $(date +%s));Safari;" "$dest"
          xattr -p com.apple.quarantine "$dest"
          echo "APP=$dest" >> "$GITHUB_ENV"
      - name: Launch and observe
        run: |
          set -x
          start=$(date "+%Y-%m-%d %H:%M:%S")
          ( open "$APP"; echo "open returned $?" ) &
          sleep 40
          ps -axo pid,stat,etime,%cpu,command | grep -i "RunHQ" | grep -v grep | cut -c1-220 || echo "NO RunHQ PROCESS"
          lsappinfo list 2>/dev/null | grep -A9 '"RunHQ"' || echo "not in lsappinfo"
          screencapture -x "$RUNNER_TEMP/screen.png" || true
          pid=$(pgrep -x RunHQ | head -1 || true)
          if [ -n "$pid" ]; then sample "$pid" 3 -file "$RUNNER_TEMP/sample.txt" >/dev/null 2>&1 || true; sed -n '/Call graph/,/Thread_.*$/p' "$RUNNER_TEMP/sample.txt" | head -45 | cut -c1-200; fi
          log show --style compact --start "$start" --predicate 'process CONTAINS "RunHQ" OR eventMessage CONTAINS[c] "runhq" OR process == "syspolicyd"' > "$RUNNER_TEMP/unified.log" 2>&1 || true
          grep -iE "translocat|syspolicy|gatekeeper|error|fault|denied|kill|crash|fail" "$RUNNER_TEMP/unified.log" | grep -v "Sandbox restriction\|MobileGestalt" | cut -c1-260 | head -50 || true
          pkill -x RunHQ || true; pkill -x open || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag3-${{ matrix.os }}-${{ matrix.where }}
          path: |
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/*.log
